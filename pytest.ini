[pytest]
testpaths = tests
addopts = -m "not destructive"
timeout = 300
timeout_method = thread
markers =
    acceptance(n): يربط اختبار الوحدة برقم اختبار القبول في §١١ من الوثيقة الوظيفية
    concurrency: اختبار تزامن حقيقي (threads/processes باتصالات منفصلة) — أبطأ من البقية
    destructive: تأثير حقيقي شامل على قاعدة التطوير المشتركة (مثل purge-demo-data) — مُستبعد من التشغيل الافتراضي (addopts)، شغّله يدوياً بـ"pytest -m destructive" فقط حين تتأكد أن لا بيانات عرض حية (demo_admin ونحوه) يعتمد عليها أحد الآن
